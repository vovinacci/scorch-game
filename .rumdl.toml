# Markdown lint and format (https://rumdl.dev). `rumdl fmt` rewraps prose to 120 columns.
[global]
line-length = 120
# CHANGELOG.md is generated by release-plz on every release; third_party/quad-snd is another project's crate, kept
# as published.
exclude = ["CHANGELOG.md", "third_party/quad-snd"]

# GitHub templates start with a comment, not a heading.
[per-file-ignores]
".github/pull_request_template.md" = ["MD041"]

[MD013]
line-length = 120
reflow = true
reflow-mode = "normalize"
code-blocks = false
tables = false
