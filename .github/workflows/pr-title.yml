name: PR title

# Squash merges make the PR title the commit on main, so it must be a Conventional Commit. Uses pull_request, not
# pull_request_target: the check only reads the title, so it needs no write access or secrets.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            docs
            test
            ci
            build
            chore
            revert
