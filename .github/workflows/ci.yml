name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS the game supports (README, packaging/Info.plist), whatever the runner's version.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Sound links ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # The same hooks as a local commit (whitespace, ASCII, Markdown, rustfmt, clippy), with the tools from the
      # hash-pinned requirements.txt.
      - name: Hooks
        run: make hooks
      - name: Tests
        run: cargo test --locked
      - name: Clippy without self-update (the build packagers use)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories, licences, duplicates and sources, as set in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
          - { name: Windows x86_64, os: windows-latest }
          - { name: Windows ARM64, os: windows-11-arm }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # build.rs reads the version from git tags
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Linux: linked against a fixed glibc, then checked (tools/build-linux.sh).
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: tools/build-linux.sh
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --locked

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Builds and tests the package NixOS players install with `nix run github:vovinacci/scorch-game`.
      - name: Build
        run: nix build -L .#
      - name: Version
        run: ./result/bin/scorch --version
