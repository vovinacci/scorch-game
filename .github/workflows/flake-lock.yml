name: Update flake.lock

# Dependabot doesn't handle Nix, so this opens a weekly PR that updates nixpkgs in flake.lock.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          # A personal token lets the PR trigger CI; GITHUB_TOKEN works, but its PRs skip CI.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          commit-msg: "build: update flake.lock"
          pr-title: "build: update flake.lock"
          pr-labels: dependencies
