# Git hooks run by prek (https://prek.j178.dev), a fast pre-commit replacement.
# Set up once with `prek install`; run by hand with `prek run --all-files`.
#:schema https://www.schemastore.org/prek.json

# Third-party licence text stays exactly as published.
exclude = '^assets/fonts/LICENSE-OFL\.txt$'

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files", args = ["--maxkb=1024"] },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
]

# Project checks, through make so they work the same on NixOS (nix-shell) and elsewhere.
# Markdown: rumdl lints and rewraps prose to 120 columns (settings in .rumdl.toml).
[[repos]]
repo = "local"
hooks = [
    { id = "ascii", name = "ASCII in code and config", entry = "tools/check_ascii.sh", language = "system", files = '(\.(rs|toml|py|nix|sh)|Makefile|\.editorconfig)$' },
    { id = "docs", name = "markdown (rumdl)", entry = "make docs-check", language = "system", types = ["markdown"], pass_filenames = false },
    { id = "cargo-fmt", name = "cargo fmt", entry = "make fmt-check", language = "system", types = ["rust"], pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", entry = "make lint", language = "system", files = '\.(rs|toml|ftl)$', pass_filenames = false },
    { id = "cargo-test", name = "cargo test", entry = "make test", language = "system", files = '\.(rs|toml|ftl|md)$', pass_filenames = false, stages = ["pre-push"] },
]
