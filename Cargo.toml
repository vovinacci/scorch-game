[package]
name = "scorch"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Turn-based artillery game, a tribute to Scorched Earth (1991)"
authors = ["Volodymyr Shcherbinin (vovin)"]

[features]
# Self-update from GitHub Releases. Packagers with their own updates (Nix, distributions) build without it:
# --no-default-features.
default = ["self-update"]
self-update = ["dep:minisign-verify", "dep:self-replace", "dep:sha2", "dep:ureq"]

[dependencies]
dirs = "7.0.0"
fluent-bundle = "0.16.0"
macroquad = { version = "0.4.16", features = ["audio"] }
minisign-verify = { version = "0.3.0", optional = true }
self-replace = { version = "1.5.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", optional = true }
sys-locale = "0.3.2"
unic-langid = "0.9.6"
ureq = { version = "3.5.0", optional = true }

# Puts the icon into scorch.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Light optimization for our code (AI aiming simulates thousands of shots),
# full optimization for dependencies. Still fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Game code turns pixels, counts and indices into floats and back all the time; marking every cast adds noise, not
# safety.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Picked from the restriction group.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
